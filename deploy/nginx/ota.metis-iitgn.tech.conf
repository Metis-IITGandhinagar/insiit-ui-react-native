# INSIIT over-the-air updates — static host for the Expo Updates protocol (v1).
#
#   /manifest        the update manifest, picked by request headers (see the maps below)
#   /blobs/<hash>    content-addressed JS bundles and assets, immutable forever
#
# Nothing here executes application code: `npm run ota` bakes the manifests on a dev
# machine and rsyncs them up, so this box only ever serves files.
#
# Install:
#   sudo install -d -o www-data -g www-data /var/www/insiit-ota
#   sudo cp ota.metis-iitgn.tech.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/ota.metis-iitgn.tech.conf /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d ota.metis-iitgn.tech
#   sudo nginx -t && sudo systemctl reload nginx
#
# The three maps must live at http{} level, so they go in this file *outside* server{}
# (a file in sites-enabled/ is included inside http{}).

# expo-updates sends the platform it wants a manifest for. Anything else is a bad request.
map $http_expo_platform $ota_platform {
    default   "";
    "ios"     "ios";
    "android" "android";
}

# Interpolated into a filesystem path below, so it is whitelisted, not sanitised:
# anything containing a slash or a dot-dot fails the regex and yields "" → 400.
map $http_expo_runtime_version $ota_runtime {
    default                    "";
    "~^[A-Za-z0-9._-]{1,64}$"  $http_expo_runtime_version;
}

# Builds set this via expo.updates.requestHeaders in app.json. Missing or malformed
# falls back to production, which is the only channel a store build ever asks for.
map $http_expo_channel_name $ota_channel {
    default                    "production";
    "~^[A-Za-z0-9._-]{1,64}$"  $http_expo_channel_name;
}

server {
    listen 80;
    listen [::]:80;
    server_name ota.metis-iitgn.tech;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ota.metis-iitgn.tech;

    # certbot rewrites these two lines when you run it; keep the block after that.
    ssl_certificate     /etc/letsencrypt/live/ota.metis-iitgn.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ota.metis-iitgn.tech/privkey.pem;

    root /var/www/insiit-ota;

    access_log /var/log/nginx/insiit-ota.access.log;
    error_log  /var/log/nginx/insiit-ota.error.log;

    # A 7 MB bundle on a small box: let the kernel do the copying, and never buffer
    # whole responses in memory.
    sendfile   on;
    tcp_nopush on;

    location = /manifest {
        if ($ota_platform = "") {
            return 400;
        }
        if ($ota_runtime = "") {
            return 400;
        }

        # Protocol handshake headers. `always` so they are present on the 404 too.
        add_header expo-protocol-version 1 always;
        add_header expo-sfv-version 0 always;
        add_header cache-control "private, max-age=0" always;

        # A missing file means "no update published for this runtime version yet"; the
        # client logs it and keeps running the bundle baked into the APK.
        try_files /manifests/$ota_channel/$ota_runtime/$ota_platform.json =404;
    }

    # Content-addressed: a given URL's bytes never change, so cache hard.
    location /blobs/ {
        add_header cache-control "public, max-age=31536000, immutable" always;

        # `npm run ota` writes a .gz next to each bundle. Uncomment if this nginx has
        # the module — check with: nginx -V 2>&1 | grep -o with-http_gzip_static_module
        # gzip_static on;

        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
